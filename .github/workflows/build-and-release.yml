name: Build & Release

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'gradle.properties'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Read version
        id: ver
        run: |
          VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=client-v$VERSION" >> $GITHUB_OUTPUT

      - name: Build JAR
        run: ./gradlew build --no-daemon -x test

      - name: Rename JAR
        run: |
          cp build/libs/nullclient-${{ steps.ver.outputs.version }}.jar \
             nullclient-${{ steps.ver.outputs.version }}.jar

      - name: Delete existing release (if any)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ${{ steps.ver.outputs.tag }} --yes 2>/dev/null || true

      - name: Create Release & Upload JAR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.ver.outputs.tag }} \
            nullclient-${{ steps.ver.outputs.version }}.jar \
            --title "NullClient ${{ steps.ver.outputs.version }}" \
            --notes "Автоматическая сборка с GitHub Actions." \
            --latest
